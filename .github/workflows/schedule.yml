name: DealOS Source Monitor

on:
  schedule:
    - cron: "0 8 * * 1,3"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealos-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run DealOS monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DEALOS_BASE_URL: https://kush-sba-deal-os.kgali01.chatgpt.site
        run: python screener.py
      - name: Retain failed monitor payload
        if: failure() && hashFiles('monitor-run.json') != ''
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dealos-monitor-payload-${{ github.run_id }}
          path: monitor-run.json
          if-no-files-found: ignore
          retention-days: 14
